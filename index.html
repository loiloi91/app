<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHO ỨNG DỤNG ANDROID TV - 0972 515 368</title>
  <style>
    :root {
      --bg-dark: #0a0b0e;
      --card-bg: rgba(18, 20, 28, 0.85);
      --card-hover: rgba(28, 32, 45, 0.95);
      --accent-cyan: #00f0ff;
      --accent-purple: #7000ff;
      --accent-gradient: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%);
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 40px 20px;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Khung chứa các SĐT trôi nổi */
    #floating-icons-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    /* ĐỊNH DẠNG SĐT CẦU VỒNG LÒE LOẸT */
    .floating-phone {
      position: absolute;
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 1px;
      white-space: nowrap;
      user-select: none;
      will-change: transform;
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #00f0ff, #0000ff, #8b00ff, #ff007f);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbowGlow 3s ease infinite;
      filter: drop-shadow(0 0 10px rgba(255, 0, 128, 0.8)) drop-shadow(0 0 20px rgba(0, 229, 255, 0.6));
    }

    @keyframes rainbowGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Canvas Pháo Hoa Nền */
    #fireworksCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ======= HEADER PRO ENTERPRISE DESIGN ======= */
    header.pro-header {
      max-width: 1200px;
      margin: 0 auto 45px auto;
      text-align: center;
      padding: 40px 25px 35px 25px;
      background: linear-gradient(180deg, rgba(22, 26, 38, 0.85) 0%, rgba(12, 14, 20, 0.6) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    header.pro-header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 10%; right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00f0ff, #7000ff, transparent);
      box-shadow: 0 0 15px #00f0ff;
    }

    .header-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }

    /* Thêm style cơ bản cho App Grid để hiển thị card ứng dụng */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .app-card:hover {
      background: var(--card-hover);
      border-color: var(--accent-cyan);
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15);
    }

    .app-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .btn-download {
      display: inline-block;
      padding: 10px 20px;
      background: var(--accent-gradient);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .btn-download:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Hiệu ứng nền -->
  <div id="floating-icons-container"></div>
  <canvas id="fireworksCanvas"></canvas>

  <div class="container">
    <header class="pro-header">
      <div class="header-logo">
        <h1>KHO ỨNG DỤNG ANDROID TV</h1>
      </div>
      <p style="color: var(--text-muted); margin-top: 10px;">Hotline hỗ trợ: 0972 515 368</p>
    </header>

    <!-- Danh sách ứng dụng -->
    <div class="app-grid">
      <!-- Card Launcher Manager -->
      <div class="app-card">
        <div class="app-title">Launcher Manager</div>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Công cụ quản lý và thay đổi Launcher mặc định cho Android TV.</p>
        <a href="https://www.dropbox.com/scl/fi/4nk02n5m6xpdzj4xccvxq/Launcher-Manager.apk?rlkey=fmotxk51ddxeku100us5n0np8&st=z0qzn7te&dl=1" class="btn-download">TẢI VỀ APK</a>
      </div>
    </div>
  </div>

</body>
</html>
